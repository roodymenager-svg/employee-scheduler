<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapport JCL</title>
  <style>
    :root{--navy:#12344d;--teal:#2f5ca8;--line:#9db0bd;--soft:#edf3f6;--paper:#fff;--text:#132734}*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:var(--text);font:14px/1.4 Arial,sans-serif}header{background:var(--navy);color:#fff;padding:16px max(20px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#d2e1e9}.header-logo{width:116px;height:66px;flex:0 0 auto;background:url('jcl-logo.png') center center/100% auto no-repeat;border-radius:5px}main{max-width:1080px;margin:22px auto;padding:0 18px}.toolbar{background:#fff;border:1px solid #d3dfe5;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.button{border:0;border-radius:6px;padding:9px 12px;background:var(--teal);color:#fff;cursor:pointer;font:700 14px Arial;text-decoration:none}button.alt,a.alt{background:#e4edf1;color:#183040}.notice{display:none;margin:15px 0;padding:10px 12px;border-radius:7px;background:#d9f1ed;color:#075c56}.day-report{margin-top:20px}.team-report{background:var(--paper);border:1px solid var(--line);margin-bottom:20px;box-shadow:0 2px 8px #102b3e12}.sheet-title{background:var(--navy);color:#fff;text-align:center;font-weight:700;font-size:21px;padding:12px}.team-title{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#d9e7ed;border-bottom:1px solid var(--line);padding:9px 12px;font-weight:700}.metadata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line)}.metadata label{display:grid;grid-template-columns:150px 1fr;align-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:42px}.metadata label:nth-child(even){border-right:0}.metadata span{font-weight:700;padding:9px;background:var(--soft);height:100%}.metadata input,.metadata select{border:0;min-width:0;padding:9px;background:#fff;font:inherit;color:var(--text)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}th{background:var(--navy);color:#fff;font-size:12px}td.number{width:46px;text-align:center;background:#f5f8fa}td input{border:0;width:100%;padding:6px;font:inherit;background:transparent}td input:focus,.metadata input:focus,.metadata select:focus,textarea:focus{outline:2px solid #78bcb6;outline-offset:-2px}.copy{display:block;margin-top:5px;padding:4px 6px;font-size:11px;background:#dce9ee;color:#173349}.total{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;background:var(--soft);font-size:16px}.comments{border-top:1px solid var(--line);padding:10px}.comments label{display:grid;gap:5px;font-weight:700}.comments textarea{min-height:74px;resize:vertical;border:1px solid var(--line);padding:8px;font:inherit}.period-summary{background:#fff;border:1px solid var(--line);margin:22px 0;padding:14px;box-shadow:0 2px 8px #102b3e12}.period-summary h2{margin:0 0 12px;font-size:18px}.period-summary table{min-width:0}.period-grand-total{margin-top:12px;text-align:right;font-size:17px;font-weight:700}.report-footer-logo{display:block;width:150px;height:auto;margin:8px auto 24px}.empty{background:#fff;border:1px solid var(--line);padding:22px;text-align:center;color:#5c7180}.muted{color:#526978;font-weight:400}@media(max-width:700px){.metadata{grid-template-columns:1fr}.metadata label{border-right:0}.metadata label{grid-template-columns:130px 1fr}}@page{margin:12mm 12mm 34mm}@media print{body{background:#fff}header,.toolbar,.notice,.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.team-report{box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin:0 0 18px}.day-report{margin:0}.metadata input,.metadata select,td input,textarea{appearance:none;background:transparent}.comments textarea{border:0;min-height:36px}.report-footer-logo{position:fixed;right:12mm;bottom:5mm;width:72px;height:auto;margin:0;opacity:.62}}
  </style>
</head>
<body>
  <header><div><h1>JCL Multiservices — Rapport</h1><p id="periodText">Rapport</p></div><div class="header-logo" role="img" aria-label="Logo JCL Multiservices"></div></header>
  <main>
    <section class="toolbar no-print"><a class="button alt" href="scheduler-clean.html">← Retour au planificateur</a><div class="actions"><button id="saveReport" type="button">Enregistrer</button><button class="alt" id="printReport" type="button">Imprimer / enregistrer en PDF</button><button id="emailReport" type="button">Préparer le courriel du rapport</button></div></section>
    <div id="notice" class="notice"></div><div id="reports"></div>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    const firebaseApp = initializeApp({apiKey:'AIzaSyDxUwzltgr0VGcIbC-fUCBsxSGGF_bz0MU',authDomain:'jcl-new-employer-schedule.firebaseapp.com',projectId:'jcl-new-employer-schedule',storageBucket:'jcl-new-employer-schedule.firebasestorage.app',messagingSenderId:'284561617913',appId:'1:284561617913:web:35e21582b0c53b1dc4c328'});
    onAuthStateChanged(getAuth(firebaseApp),user=>{if(!user)location.replace('scheduler-clean.html');});
  </script>
  <script>
    const SCHEDULE_KEY='jcl-scheduler-clean-v1',REPORT_KEY='jcl-scheduler-reports-v1';
    const $=id=>document.getElementById(id),escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const parseDate=value=>new Date(`${value}T12:00:00`),iso=date=>date.toISOString().slice(0,10),dayLabel=date=>date.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const query=new URLSearchParams(location.search),mode=query.get('mode')==='week'?'week':'day',dateParam=query.get('date'),startParam=query.get('start');
    let scheduleState,reports={};
    function notify(message){const notice=$('notice');notice.textContent=message;notice.style.display='block';setTimeout(()=>notice.style.display='none',3500)}
    function dates(){const fallback=scheduleState?.schedule?.[0]?.date||Object.keys(scheduleState?.archive||{}).sort()[0];if(mode==='day')return dateParam?[dateParam]:fallback?[fallback]:[];const start=parseDate(startParam||fallback);return Number.isNaN(start.getTime())?[]:Array.from({length:7},(_,index)=>{const date=new Date(start);date.setDate(date.getDate()+index);return iso(date)})}
    function getDay(date){return scheduleState.archive?.[date]||scheduleState.schedule?.find(day=>day.date===date)||{date,teams:[]}}
    function teamKey(team,index){return `${index}-${team.name||'Équipe'}`}
    function emptyTeam(team,index){return {key:teamKey(team,index),name:team.name||`Équipe ${index+1}`,task:team.assignmentType||'Garnissage des rayons',site:team.site||'',chauffeur:team.driver||'',vehicle:'Véhicule du chauffeur',distance:'',comments:'',employees:(team.members||[]).map(name=>({name,start:'',end:'',pause:'30'}))}}
    function reportFor(date){const day=getDay(date),saved=reports[date]||{},legacy=saved.employees||[],teams=[];day.teams.forEach((team,index)=>{const base=emptyTeam(team,index),previous=saved.teams?.find(item=>item.key===base.key)||{},employees=base.employees.map(employee=>{const old=previous.employees?.find(item=>item.name===employee.name)||legacy.find(item=>item.name===employee.name)||{};return {...employee,...old,pause:old.pause===''||old.pause===undefined?'30':old.pause}});teams.push({...base,...previous,employees})});return {date,teams}}
    function minutesWorked(employee){if(!employee.start||!employee.end)return null;const [sh,sm]=employee.start.split(':').map(Number),[eh,em]=employee.end.split(':').map(Number);let minutes=(eh*60+em)-(sh*60+sm)-Number(employee.pause||0);if(minutes<0)minutes+=1440;return minutes}
    function formatMinutes(minutes){if(minutes===null||Number.isNaN(minutes))return '—';return `${Math.floor(minutes/60)}h${String(minutes%60).padStart(2,'0')} mn`}
    function render(){const selected=dates();$('periodText').textContent=selected.length?(mode==='week'?`Rapport de la semaine — ${dayLabel(parseDate(selected[0]))} au ${dayLabel(parseDate(selected.at(-1)))}`:`Rapport du jour — ${dayLabel(parseDate(selected[0]))}`):'Rapport';if(!selected.length){$('reports').innerHTML='<section class="empty">Aucune journée de l’horaire n’est disponible.</section>';return}$('reports').innerHTML=selected.map(date=>{const report=reportFor(date),teams=report.teams.map((team,teamIndex)=>({...team,teamIndex})).filter(team=>team.employees.length);if(!teams.length)return '';return `<section class="day-report">${teams.map(team=>`<section class="team-report" data-date="${date}" data-team-index="${team.teamIndex}"><div class="sheet-title">JCL Multiservice</div><div class="team-title"><span>${escapeHtml(dayLabel(parseDate(date)))}</span><span>${escapeHtml(team.name)} <span class="muted">— ${escapeHtml(team.task)}</span></span></div><div class="metadata"><label><span>Site</span><input data-field="site" value="${escapeHtml(team.site)}"></label><label><span>Chauffeur (${escapeHtml(team.name)})</span><input data-field="chauffeur" value="${escapeHtml(team.chauffeur)}" placeholder="Nom du chauffeur"></label><label><span>Véhicule utilisé</span><select data-field="vehicle"><option ${team.vehicle==='Véhicule du chauffeur'?'selected':''}>Véhicule du chauffeur</option><option ${team.vehicle==='Véhicule de JCL (Lucien)'?'selected':''}>Véhicule de JCL (Lucien)</option></select></label><label><span>Distance parcourue (KM)</span><input data-field="distance" type="number" min="0" step="0.1" value="${escapeHtml(team.distance)}"></label></div><div class="table-wrap"><table><thead><tr><th>N°</th><th>Nom et prénom</th><th>Heure de départ</th><th>Heure de fin</th><th>Pause (min)</th><th>Nombre d’heures travaillées</th></tr></thead><tbody>${team.employees.length?team.employees.map((employee,index)=>`<tr data-person="${index}"><td class="number">${index+1}</td><td>${escapeHtml(employee.name)}</td><td><input data-time="start" type="time" value="${escapeHtml(employee.start)}">${index===0?`<button class="copy no-print" type="button" onclick="copyTimeToTeam('${date}',${team.teamIndex},'start')">Copier à l’équipe</button>`:''}</td><td><input data-time="end" type="time" value="${escapeHtml(employee.end)}">${index===0?`<button class="copy no-print" type="button" onclick="copyTimeToTeam('${date}',${team.teamIndex},'end')">Copier à l’équipe</button>`:''}</td><td><input data-time="pause" type="number" min="0" step="5" value="${escapeHtml(employee.pause)}"></td><td data-hours>—</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Aucun employé dans cette équipe.</td></tr>'}</tbody></table></div><div class="total">Total d’heures travaillées : <strong data-total-hours>0h00 mn</strong></div><div class="comments"><label>Commentaires<textarea data-field="comments">${escapeHtml(team.comments)}</textarea></label></div></section>`).join('')}</section>`}).join('')||'<section class="empty">Aucun employé n’est affecté durant cette période.</section>';$('reports').insertAdjacentHTML('beforeend','<section id="periodSummary" class="period-summary"></section><img class="report-footer-logo" src="jcl-logo.png" alt="Logo JCL Multiservices">');updateHours()}
    function updateHours(){document.querySelectorAll('.team-report').forEach(section=>{let total=0;section.querySelectorAll('tr[data-person]').forEach(row=>{const employee={start:row.querySelector('[data-time="start"]').value,end:row.querySelector('[data-time="end"]').value,pause:row.querySelector('[data-time="pause"]').value},minutes=minutesWorked(employee);row.querySelector('[data-hours]').textContent=formatMinutes(minutes);if(minutes!==null)total+=minutes});section.querySelector('[data-total-hours]').textContent=formatMinutes(total)});updatePeriodSummary()} function updatePeriodSummary(){const summary=$('periodSummary');if(!summary)return;const totals=new Map;let grandTotal=0;document.querySelectorAll('.team-report tr[data-person]').forEach(row=>{const name=row.children[1].textContent.trim(),employee={start:row.querySelector('[data-time="start"]').value,end:row.querySelector('[data-time="end"]').value,pause:row.querySelector('[data-time="pause"]').value},minutes=minutesWorked(employee);if(!totals.has(name))totals.set(name,0);if(minutes!==null){totals.set(name,totals.get(name)+minutes);grandTotal+=minutes}});if(!totals.size){summary.innerHTML='';return}const title=mode==='week'?'Total des heures — période de 7 jours':'Total des heures — journée';summary.innerHTML=`<h2>${title}</h2><table><thead><tr><th>Employé</th><th>Total d’heures travaillées</th></tr></thead><tbody>${[...totals.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([name,minutes])=>`<tr><td>${escapeHtml(name)}</td><td>${formatMinutes(minutes)}</td></tr>`).join('')}</tbody></table><div class="period-grand-total">Total général de la période : ${formatMinutes(grandTotal)}</div>`}
    function readTeam(section){const fields=name=>section.querySelector(`[data-field="${name}"]`)?.value||'';return {key:teamKey({name:section.querySelector('.team-title span:last-child').childNodes[0].textContent.trim()},Number(section.dataset.teamIndex)),name:section.querySelector('.team-title span:last-child').childNodes[0].textContent.trim(),site:fields('site'),chauffeur:fields('chauffeur'),vehicle:fields('vehicle'),distance:fields('distance'),comments:fields('comments'),employees:[...section.querySelectorAll('tr[data-person]')].map(row=>({name:row.children[1].textContent.trim(),start:row.querySelector('[data-time="start"]').value,end:row.querySelector('[data-time="end"]').value,pause:row.querySelector('[data-time="pause"]').value}))}}
    function saveReports(){document.querySelectorAll('.day-report').forEach(day=>{const sections=[...day.querySelectorAll('.team-report')];if(sections.length)reports[sections[0].dataset.date]={date:sections[0].dataset.date,teams:sections.map(readTeam)}});localStorage.setItem(REPORT_KEY,JSON.stringify(reports));notify('Rapport enregistré.')}
    function copyTimeToTeam(date,teamIndex,type){const section=document.querySelector(`.team-report[data-date="${date}"][data-team-index="${teamIndex}"]`),first=section?.querySelector('tr[data-person="0"] [data-time="'+type+'"]');if(!first?.value){notify('Saisissez d’abord une heure pour le premier employé.');return}section.querySelectorAll(`tr[data-person] [data-time="${type}"]`).forEach(input=>input.value=first.value);updateHours();notify(`Heure ${type==='start'?'de départ':'de fin'} copiée à toute l’équipe.`)}
    window.copyTimeToTeam=copyTimeToTeam;
    function summary(){saveReports();return dates().map(date=>{const report=reports[date];return [dayLabel(parseDate(date)),...(report?.teams||[]).flatMap(team=>[`${team.name} — Chauffeur : ${team.chauffeur||'Non défini'}`,`Site : ${team.site||'Non défini'}`,...team.employees.map(employee=>`${employee.name} : ${employee.start||'—'} à ${employee.end||'—'}, pause ${employee.pause||'0'} min`),''])].join('\n')}).join('\n')}
    $('saveReport').addEventListener('click',saveReports);$('printReport').addEventListener('click',()=>{saveReports();window.print()});$('emailReport').addEventListener('click',()=>{const subject=mode==='week'?'Rapport JCL de la semaine':'Rapport JCL du jour',body=`Bonjour,\n\nVeuillez trouver le rapport JCL ci-dessous.\n\n${summary()}\nJCL Multiservices`;location.href=`https://outlook.office.com/mail/deeplink/compose?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`});document.addEventListener('input',event=>{if(event.target.matches('[data-time]'))updateHours()});document.addEventListener('change',event=>{if(event.target.matches('[data-time]'))updateHours()});
    try{scheduleState=JSON.parse(localStorage.getItem(SCHEDULE_KEY));reports=JSON.parse(localStorage.getItem(REPORT_KEY)||'{}');if(!scheduleState)throw Error();render()}catch{$('reports').innerHTML='<section class="empty">Impossible de trouver l’horaire. Retournez au planificateur et créez une affectation avant d’ouvrir un rapport.</section>'}
  </script>
</body>
</html>
