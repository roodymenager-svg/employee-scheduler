  <header><div><h1>JCL Multiservices — Rapport</h1><p id="periodText">Rapport</p></div><div class="header-logo" role="img" aria-label="Logo JCL Multiservices"></div></header>
  <main>

    const firebaseConfig={apiKey:'AIzaSyDxUvzlTgr0VGcIbC-fUCBsxSGGF_bz0MU',authDomain:'jcl-new-employer-schedule.firebaseapp.com',projectId:'jcl-new-employer-schedule',storageBucket:'jcl-new-employer-schedule.firebasestorage.app',messagingSenderId:'284561617913',appId:'1:284561617913:web:1368ae7db1e125bfc4c328'};

    ['pointerdown','keydown','touchstart','scroll'].forEach(eventName=>document.addEventListener(eventName,resetReportActivity,{passive:true}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)verifyReportAccess()});
    verifyReportAccess();

    const query=new URLSearchParams(location.search),requestedMode=query.get('mode'),mode=requestedMode==='month'?'month':requestedMode==='week'?'week':'day',dateParam=query.get('date'),startParam=query.get('start'),monthParam=query.get('month');
    let scheduleState,reports={},currentUser=null,cloudReady=false,cloudLoaded=false,stopCloudSync=null;
    const reportFieldHasFocus=()=>document.activeElement?.matches?.('#reports input,#reports textarea,#reports select');
    function notify(message){const notice=$('notice');notice.textContent=message;notice.style.display='block';setTimeout(()=>notice.style.display='none',3500)}
    function dates(){const fallback=scheduleState?.schedule?.[0]?.date||Object.keys(scheduleState?.archive||{}).sort()[0];if(mode==='day')return dateParam?[dateParam]:fallback?[fallback]:[];if(mode==='month'){const value=/^\d{4}-\d{2}$/.test(monthParam||'')?monthParam:(startParam||fallback||'').slice(0,7);if(!/^\d{4}-\d{2}$/.test(value))return[];const [year,month]=value.split('-').map(Number),count=new Date(year,month,0).getDate();return Array.from({length:count},(_,index)=>`${value}-${String(index+1).padStart(2,'0')}`)}const start=parseDate(startParam||fallback);return Number.isNaN(start.getTime())?[]:Array.from({length:7},(_,index)=>{const date=new Date(start);date.setDate(date.getDate()+index);return iso(date)})}
    function getDay(date){return scheduleState.archive?.[date]||scheduleState.schedule?.find(day=>day.date===date)||{date,teams:[]}}
    function teamKey(team,index){return `${index}-${team.name||'Équipe'}`}
    function emptyTeam(team,index){return {key:teamKey(team,index),name:team.name||`Équipe ${index+1}`,task:team.assignmentType||'Garnissage des rayons',site:team.site||'',chauffeur:team.driver||'',vehicle:'Véhicule du chauffeur',distance:'',driverStart:'',driverEnd:'',comments:'',employees:(team.members||[]).map(name=>({name,start:'',end:'',pause:'30'}))}}
    function reportFor(date){const day=getDay(date),saved=reports[date]||{},legacy=saved.employees||[],teams=[];if((!day.teams||!day.teams.length)&&saved.teams?.length)return {date,teams:saved.teams};day.teams.forEach((team,index)=>{const base=emptyTeam(team,index),previous=saved.teams?.find(item=>item.key===base.key)||{},employees=base.employees.map(employee=>{const old=previous.employees?.find(item=>item.name===employee.name)||legacy.find(item=>item.name===employee.name)||{};return {...employee,...old,pause:old.pause===''||old.pause===undefined?'30':old.pause}});teams.push({...base,...previous,employees})});return {date,teams}}
    function minutesWorked(employee){if(!employee.start||!employee.end)return null;const [sh,sm]=employee.start.split(':').map(Number),[eh,em]=employee.end.split(':').map(Number);let minutes=(eh*60+em)-(sh*60+sm)-Number(employee.pause||0);if(minutes<0)minutes+=1440;return minutes}
    function formatMinutes(minutes){if(minutes===null||Number.isNaN(minutes))return '—';return `${Math.floor(minutes/60)}h${String(minutes%60).padStart(2,'0')} mn`}
    function isComptecTask(task){return task==="Préposé à l'inventaire (COMPTEC)"} function render(){const selected=dates();$('periodText').textContent=selected.length?(mode==='week'?`Rapport de la semaine — ${dayLabel(parseDate(selected[0]))} au ${dayLabel(parseDate(selected.at(-1)))}`:`Rapport du jour — ${dayLabel(parseDate(selected[0]))}`):'Rapport';if(!selected.length){$('reports').innerHTML='<section class="empty">Aucune journée de l’horaire n’est disponible.</section>';return}$('reports').innerHTML=selected.map(date=>{const report=reportFor(date),teams=report.teams.map((team,teamIndex)=>({...team,teamIndex})).filter(team=>team.employees.length);if(!teams.length)return '';return `<section class="day-report">${teams.map(team=>`<section class="team-report${isComptecTask(team.task)?' comptec-report':''}" data-date="${date}" data-team-index="${team.teamIndex}"><div class="sheet-title">${isComptecTask(team.task)?'COMPTEC':'JCL Multiservice'}</div><div class="team-title"><span>${escapeHtml(dayLabel(parseDate(date)))}</span><span>${escapeHtml(team.name)} <span class="muted">— ${escapeHtml(team.task)}</span></span></div><div class="metadata"><label><span>Site</span><input data-field="site" value="${escapeHtml(team.site)}"></label><label><span>Chauffeur (${escapeHtml(team.name)})</span><input data-field="chauffeur" value="${escapeHtml(team.chauffeur)}" placeholder="Nom du chauffeur"></label><label><span>Véhicule utilisé</span><select data-field="vehicle"><option ${team.vehicle==='Véhicule du chauffeur'?'selected':''}>Véhicule du chauffeur</option><option ${(team.vehicle==='Véhicule de Lucien'||team.vehicle==='Véhicule de JCL (Lucien)')?'selected':''}>Véhicule de Lucien</option></select></label><label><span>Distance parcourue (KM)</span><input data-field="distance" type="number" min="0" step="0.1" value="${escapeHtml(team.distance)}"></label></div><div class="table-wrap"><table><thead><tr><th>N°</th><th>Nom et prénom</th><th>Heure de départ</th><th>Heure de fin</th><th>Pause (min)</th><th>Nombre d’heures travaillées</th></tr></thead><tbody>${team.employees.length?team.employees.map((employee,index)=>`<tr data-person="${index}"><td class="number">${index+1}</td><td>${escapeHtml(employee.name)}</td><td><input data-time="start" type="time" value="${escapeHtml(employee.start)}">${index===0?`<button class="copy no-print" type="button" onclick="copyTimeToTeam('${date}',${team.teamIndex},'start')">Copier à l’équipe</button>`:''}</td><td><input data-time="end" type="time" value="${escapeHtml(employee.end)}">${index===0?`<button class="copy no-print" type="button" onclick="copyTimeToTeam('${date}',${team.teamIndex},'end')">Copier à l’équipe</button>`:''}</td><td><input data-time="pause" type="number" min="0" step="5" value="${escapeHtml(employee.pause)}"></td><td data-hours>—</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Aucun employé dans cette équipe.</td></tr>'}</tbody></table></div><div class="total">Total d’heures travaillées : <strong data-total-hours>0h00 mn</strong></div><div class="comments"><label>Commentaires<textarea data-field="comments">${escapeHtml(team.comments)}</textarea></label></div></section>`).join('')}</section>`}).join('')||'<section class="empty">Aucun employé n’est affecté durant cette période.</section>';$('reports').insertAdjacentHTML('beforeend','<section id="periodSummary" class="period-summary"></section><img class="report-footer-logo" src="jcl-logo.png" alt="Logo JCL Multiservices">');updateHours()}
    function applyMonthlyLabels(){
      if(mode!=='month'||$('reports').querySelector('.monthly-summary-only'))return;

    }
    function syncDriverTimeFields(){if(mode==='month')setTimeout(applyMonthlyLabels,0);document.querySelectorAll('.team-report').forEach(section=>{const employeeStartHeading=section.querySelector('thead th:nth-child(3)');if(employeeStartHeading)employeeStartHeading.textContent='Heure de début';const metadata=section.querySelector('.metadata'),driver=section.querySelector('[data-field="chauffeur"]')?.value.trim().toLocaleLowerCase('fr-CA'),existing=metadata.querySelector('.driver-time-fields');if(driver!=='claudin lucien'){existing?.remove();return}if(existing)return;const report=reportFor(section.dataset.date),team=report.teams[Number(section.dataset.teamIndex)]||{};metadata.insertAdjacentHTML('beforeend',`<div class="driver-time-fields" style="display:contents"><label><span>Heure de départ</span><input data-field="driverStart" type="time" value="${escapeHtml(team.driverStart||'')}"></label><label><span>Heure d’arrivée</span><input data-field="driverEnd" type="time" value="${escapeHtml(team.driverEnd||'')}"></label></div>`)});}
    function updateHours(){syncDriverTimeFields();document.querySelectorAll('.team-report').forEach(section=>{let total=0;section.querySelectorAll('tr[data-person]').forEach(row=>{const employee={start:row.querySelector('[data-time="start"]').value,end:row.querySelector('[data-time="end"]').value,pause:row.querySelector('[data-time="pause"]').value},minutes=minutesWorked(employee);row.querySelector('[data-hours]').textContent=formatMinutes(minutes);if(minutes!==null)total+=minutes});section.querySelector('[data-total-hours]').textContent=formatMinutes(total)});updatePeriodSummary()} function updatePeriodSummary(){const jclSummary=$('periodSummary');if(!jclSummary)return;let comptecSummary=$('periodSummaryComptec');if(!comptecSummary){jclSummary.insertAdjacentHTML('afterend','<section id="periodSummaryComptec" class="period-summary"></section>');comptecSummary=$('periodSummaryComptec')}const title=mode==='week'?'Total des heures — période de 7 jours':'Total des heures — journée';function fillSummary(summary,selector,company){const totals=new Map;let grandTotal=0;document.querySelectorAll(selector).forEach(row=>{const name=row.children[1].textContent.trim(),employee={start:row.querySelector('[data-time="start"]').value,end:row.querySelector('[data-time="end"]').value,pause:row.querySelector('[data-time="pause"]').value},minutes=minutesWorked(employee);if(!totals.has(name))totals.set(name,0);if(minutes!==null){totals.set(name,totals.get(name)+minutes);grandTotal+=minutes}});summary.innerHTML=totals.size?`<h2>${company} — ${title}</h2><table><thead><tr><th>Employé</th><th>Total d’heures travaillées</th></tr></thead><tbody>${[...totals.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([name,minutes])=>`<tr><td>${escapeHtml(name)}</td><td>${formatMinutes(minutes)}</td></tr>`).join('')}</tbody></table><div class="period-grand-total">Total général ${company} : ${formatMinutes(grandTotal)}</div>`:''}fillSummary(jclSummary,'.team-report:not(.comptec-report) tr[data-person]','JCL Multiservices');fillSummary(comptecSummary,'.comptec-report tr[data-person]','COMPTEC')}
    function readTeam(section){const fields=name=>section.querySelector(`[data-field="${name}"]`)?.value||'';return {key:teamKey({name:section.querySelector('.team-title span:last-child').childNodes[0].textContent.trim()},Number(section.dataset.teamIndex)),name:section.querySelector('.team-title span:last-child').childNodes[0].textContent.trim(),site:fields('site'),chauffeur:fields('chauffeur'),vehicle:fields('vehicle'),distance:fields('distance'),driverStart:fields('driverStart'),driverEnd:fields('driverEnd'),comments:fields('comments'),employees:[...section.querySelectorAll('tr[data-person]')].map(row=>({name:row.children[1].textContent.trim(),start:row.querySelector('[data-time="start"]').value,end:row.querySelector('[data-time="end"]').value,pause:row.querySelector('[data-time="pause"]').value}))}}
    let reportSaveTimer=null;
    function waitForAuthenticatedUser(timeout=5000){const available=currentUser||firebaseAuth.currentUser;if(available)return Promise.resolve(available);return new Promise(resolve=>{const started=Date.now(),timer=setInterval(()=>{const user=currentUser||firebaseAuth.currentUser;if(user||Date.now()-started>=timeout){clearInterval(timer);resolve(user||null)}},100)})}
    async function saveReports(silent=false){document.querySelectorAll('.day-report').forEach(day=>{const sections=[...day.querySelectorAll('.team-report')];if(sections.length)reports[sections[0].dataset.date]={date:sections[0].dataset.date,teams:sections.map(readTeam)}});localStorage.setItem(REPORT_KEY,JSON.stringify(reports));const user=await waitForAuthenticatedUser();if(!user){if(!silent)notify('Rapport enregistré localement : la session Firebase n’est pas connectée.');return}try{await setDoc(sharedSchedule,{reports,reportsLastModification:{by:user.email||user.uid,at:Date.now()}},{merge:true});if(!silent)notify('Rapport enregistré et synchronisé en ligne.')}catch(error){console.error(error);if(!silent)notify('Le rapport est enregistré localement, mais la synchronisation en ligne a échoué.')}}
    function scheduleReportSave(){clearTimeout(reportSaveTimer);reportSaveTimer=setTimeout(()=>saveReports(true),700)}
    function copyTimeToTeam(date,teamIndex,type){const section=document.querySelector(`.team-report[data-date="${date}"][data-team-index="${teamIndex}"]`),first=section?.querySelector('tr[data-person="0"] [data-time="'+type+'"]');if(!first?.value){notify('Saisissez d’abord une heure pour le premier employé.');return}section.querySelectorAll(`tr[data-person] [data-time="${type}"]`).forEach(input=>input.value=first.value);updateHours();notify(`Heure ${type==='start'?'de départ':'de fin'} copiée à toute l’équipe.`)}
    window.copyTimeToTeam=copyTimeToTeam;
    function summary(){saveReports();return dates().map(date=>{const report=reports[date];return [dayLabel(parseDate(date)),...(report?.teams||[]).flatMap(team=>[`${team.name} — Chauffeur : ${team.chauffeur||'Non défini'}`,`Site : ${team.site||'Non défini'}`,...team.employees.map(employee=>`${employee.name} : ${employee.start||'—'} à ${employee.end||'—'}, pause ${employee.pause||'0'} min`),''])].join('\n')}).join('\n')}
    $('saveReport').addEventListener('click',()=>saveReports());function printOnly(type){saveReports(true);document.body.classList.remove('print-jcl','print-comptec');document.body.classList.add(type==='comptec'?'print-comptec':'print-jcl');document.body.dataset.printCompany=type;void document.body.offsetHeight;const appleTouchDevice=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(appleTouchDevice){try{if(document.execCommand('print'))return}catch(error){console.warn('Impression Safari de remplacement indisponible :',error)}}window.print()}function prepareReportEmail(type){saveReports();const sender='jcl.lucienclaudin@gmail.com',isComptec=type==='comptec',recipient=isComptec?'josee.giroux@comptecsg.com':'girouxjcl@gmail.com',name=isComptec?'COMPTEC':'JCL',period=mode==='month'?'mensuel':mode==='week'?'de la semaine':'du jour',subject=`Rapport ${name} ${period}`,body=`Bonjour,\n\nVeuillez trouver le rapport ${name} en pièce jointe.\n\n${name==='JCL'?'JCL Multiservices':'COMPTEC'}`,gmailUrl=`https://mail.google.com/mail/u/?authuser=${encodeURIComponent(sender)}&view=cm&fs=1&to=${encodeURIComponent(recipient)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;window.open(gmailUrl,'_blank','noopener')}window.addEventListener('afterprint',()=>{document.body.classList.remove('print-jcl','print-comptec');delete document.body.dataset.printCompany});$('printJclReport').addEventListener('click',()=>printOnly('jcl'));$('printComptecReport').addEventListener('click',()=>printOnly('comptec'));$('emailJclReport').addEventListener('click',()=>prepareReportEmail('jcl'));$('emailComptecReport').addEventListener('click',()=>prepareReportEmail('comptec'));document.addEventListener('input',event=>{if(event.target.matches('[data-time]'))updateHours();if(event.target.matches('[data-field="chauffeur"]'))syncDriverTimeFields();if(event.target.matches('[data-time],[data-field],textarea'))scheduleReportSave()});document.addEventListener('change',event=>{if(event.target.matches('[data-time]'))updateHours();if(event.target.matches('[data-field="chauffeur"]'))syncDriverTimeFields();if(event.target.matches('[data-time],[data-field],textarea'))scheduleReportSave()});
    function loadLocalData(){try{scheduleState=JSON.parse(localStorage.getItem(SCHEDULE_KEY));reports=JSON.parse(localStorage.getItem(REPORT_KEY)||'{}')}catch{scheduleState=null;reports={}}}
    function startCloudSync(){if(stopCloudSync)stopCloudSync();stopCloudSync=onSnapshot(sharedSchedule,snapshot=>{if(!snapshot.exists()||!snapshot.data().state){cloudReady=false;if(!reportFieldHasFocus())$('reports').innerHTML='<section class="empty">Impossible de trouver l’horaire en ligne. Retournez au planificateur et créez une affectation.</section>';return}const remote=snapshot.data(),localReports=reports,remoteReports=remote.reports||{};scheduleState=remote.state;localStorage.setItem(SCHEDULE_KEY,JSON.stringify(scheduleState));if(cloudLoaded&&JSON.stringify(remoteReports)===JSON.stringify(reports)){cloudReady=true;return}cloudLoaded=true;if(Object.keys(remoteReports).length){reports=remoteReports;localStorage.setItem(REPORT_KEY,JSON.stringify(reports));cloudReady=true;if(!reportFieldHasFocus())render();return}reports=localReports||{};cloudReady=true;if(!reportFieldHasFocus())render();if(Object.keys(reports).length)setDoc(sharedSchedule,{reports,reportsLastModification:{by:currentUser.email||currentUser.uid,at:Date.now()}},{merge:true}).catch(console.error)},error=>{console.error(error);cloudReady=false;if(scheduleState){if(!reportFieldHasFocus())render()}else if(!reportFieldHasFocus())$('reports').innerHTML='<section class="empty">Impossible de synchroniser les rapports en ligne.</section>';notify('Synchronisation en ligne indisponible. Les sauvegardes locales restent actives.')})}
    loadLocalData();if(scheduleState)render();onAuthStateChanged(firebaseAuth,user=>{currentUser=user;if(user)startCloudSync();else returnToScheduler()});
  </script>
